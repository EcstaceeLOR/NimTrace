<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">NimTrace demo product</title>
  <desc id="description">A fixed abstract placeholder for a product whose uploaded image is unavailable.</desc>
  <defs>
    <radialGradient id="background" cx="65%" cy="25%" r="80%">
      <stop offset="0" stop-color="#3ae8c2" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#090b10"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3ae8c2"/>
      <stop offset="1" stop-color="#806bf2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="96" fill="url(#background)"/>
  <circle cx="400" cy="375" r="210" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
  <circle cx="400" cy="375" r="145" fill="#0d1526" stroke="url(#mark)" stroke-width="8"/>
  <path d="M315 490V255h53l117 145V255h56v235h-49L371 341v149z" fill="url(#mark)"/>
  <text x="400" y="660" fill="#f8f8f6" font-family="system-ui,sans-serif" font-size="38" font-weight="700" text-anchor="middle">NimTrace product</text>
  <text x="400" y="706" fill="#a9b0bc" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">Image temporarily unavailable</text>
</svg>
