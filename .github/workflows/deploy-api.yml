name: Deploy API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy nimtrace-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck --workspace @nimtrace/api

      - name: Test API
        run: npm run test:unit --workspace @nimtrace/api

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/api/wrangler.jsonc --var APP_VERSION:${GITHUB_SHA}

      - name: Verify production health
        run: |
          node -e "fetch('https://nimtrace-api.nimtrace.workers.dev/api/health', { cache: 'no-store' }).then(async r => { if (!r.ok) throw new Error('health '+r.status); const j = await r.json(); if (j.version !== process.env.GITHUB_SHA) throw new Error('Worker version mismatch: '+j.version); console.log('Worker deployed:', j.version) })"
