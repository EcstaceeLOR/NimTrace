name: Deploy API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy nimtrace-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck --workspace @nimtrace/api

      - name: Test API
        run: npm run test:unit --workspace @nimtrace/api

      - name: Build Worker assets
        run: |
          npm run build --workspace @nimtrace/contracts
          npm run build --workspace @nimtrace/web

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/api/wrangler.jsonc --var APP_VERSION:${GITHUB_SHA}

      - name: Verify production health
        run: |
          node <<'NODE'
          const expected = process.env.GITHUB_SHA
          const url = 'https://nimtrace-api.nimtrace.workers.dev/api/health'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${url}?deploy=${Date.now()}`, { cache: 'no-store' })
              if (!response.ok) throw new Error(`health ${response.status}`)
              const health = await response.json()
              if (health.version === expected) {
                console.log('Worker deployed:', health.version)
                process.exit(0)
              }
              console.log(`Attempt ${attempt}: waiting for Worker propagation (${health.version})`)
            } catch (error) {
              console.log(`Attempt ${attempt}: health check not ready (${error instanceof Error ? error.message : error})`)
            }
            if (attempt < 12) await sleep(5_000)
          }

          throw new Error(`Worker version ${expected} was not visible after propagation retries`)
          NODE
